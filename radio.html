<!DOCTYPE html>
<html lang="zh" data-style="cream" data-tone="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>音波陪伴（网络收音机） v1.5 · 杰克陈</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Orbitron:wght@500;700;900&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<script>
/* 主题初始化：优先 localStorage，否则跟随系统，避免闪烁 */
(function(){
  var s=localStorage.getItem('rb_style')||'cream';
  var t=localStorage.getItem('rb_tone')||'system';
  var dark=t==='dark'||(t==='system'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-style',s);
  document.documentElement.setAttribute('data-tone',dark?'dark':'light');
})();
</script>
<style>
/* ============ 通用重置与组件（使用变量，由风格/色调驱动） ============ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{transition:background .4s ease,color .4s ease}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--font-body,"Noto Sans SC",sans-serif);
  font-size:15px;line-height:1.6;padding:24px 14px 48px;min-height:100vh;
  position:relative;overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:var(--bg-overlay,none)}
.wrap{max-width:560px;margin:0 auto;position:relative;z-index:1}

/* 抬头 */
header{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
h1{font-family:var(--font-display,"Noto Sans SC",sans-serif);font-size:20px;
  font-weight:700;flex:1;color:var(--ink);white-space:nowrap;letter-spacing:-.2px}
h1 .dot{display:inline-block;width:9px;height:9px;border-radius:50%;
  background:var(--accent);margin-right:7px;vertical-align:middle;
  box-shadow:0 0 0 4px var(--accent-soft)}
.ver{font-size:11px;color:var(--accent);background:var(--card);
  border:1px solid var(--line);border-radius:20px;padding:3px 11px;font-weight:700;
  box-shadow:var(--shadow-sm)}
.ghub{font-size:12px;color:var(--ink-soft);text-decoration:none;
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:5px 12px;font-weight:600;box-shadow:var(--shadow-sm);transition:.25s}
.ghub:hover{color:var(--accent)}

/* 主题切换控件 */
.theme-bar{display:flex;gap:6px;align-items:center;margin-left:auto}
.style-btn{font-size:12px;color:var(--ink-soft);background:var(--card);
  border:1px solid var(--line);border-radius:20px;padding:5px 12px;cursor:pointer;
  font-weight:600;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:5px;
  transition:.2s;font-family:inherit}
.style-btn:active{box-shadow:var(--shadow-inset)}
.style-btn .swatch{width:12px;height:12px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--line)}
.tone-seg{display:inline-flex;background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:3px;box-shadow:var(--shadow-sm)}
.tone-seg button{font-size:13px;line-height:1;padding:5px 9px;border-radius:16px;
  background:transparent;color:var(--muted);border:none;cursor:pointer;transition:.2s}
.tone-seg button.on{background:var(--accent);color:#fff;
  box-shadow:var(--shadow-sm)}

/* 播放卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg,22px);
  padding:20px;margin-bottom:14px;box-shadow:var(--shadow-card);position:relative;
  backdrop-filter:var(--card-blur,none)}
#now{font-size:21px;font-weight:700;color:var(--ink);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;font-family:var(--font-display,inherit)}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 12px;border-radius:20px;font-weight:600;
  background:var(--chip-bg,var(--surface));color:var(--accent);
  border:1px solid var(--line)}
.chip.warn{color:var(--warn);background:var(--warn-bg)}
.chip.err{color:var(--err);background:var(--err-bg)}
.row{display:flex;gap:10px;justify-content:center;margin-top:16px}
button{background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:var(--r-md,14px);font-size:14px;padding:12px 0;flex:1;max-width:100px;
  cursor:pointer;font-family:inherit;font-weight:600;transition:.18s;box-shadow:var(--shadow-raised)}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(2px);box-shadow:var(--shadow-inset)}
button.main{background:linear-gradient(145deg,var(--accent),var(--accent-deep));
  color:var(--accent-fg,#fff);font-weight:700;border:none;
  box-shadow:var(--shadow-accent)}
button.main:active{box-shadow:var(--shadow-accent-inset)}
button.favb{flex:0 0 auto;max-width:none;padding:12px 15px;font-size:19px}
button.favb.on{color:var(--accent-3)}
.vrow{display:flex;align-items:center;gap:12px;margin-top:14px}
.vrow .lb{font-size:13px;color:var(--ink-soft);font-weight:600;white-space:nowrap}
.vrow .vv{font-size:15px;color:var(--accent);width:2.6em;text-align:right;font-weight:700}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:8px;border-radius:4px;
  background:var(--surface);outline:none;box-shadow:var(--shadow-inset)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;
  border-radius:50%;background:var(--card);border:3px solid var(--accent);cursor:pointer;
  box-shadow:var(--shadow-raised-sm);transition:.15s}
input[type=range]::-webkit-slider-thumb:active{box-shadow:var(--shadow-inset)}
.optrow{display:flex;align-items:center;gap:10px;margin-top:14px;
  font-size:13px;color:var(--ink-soft);flex-wrap:wrap;font-weight:600}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;overflow:hidden;padding:4px;box-shadow:var(--shadow-inset)}
.seg button{flex:0 0 auto;max-width:none;padding:6px 13px;font-size:12px;
  border-radius:10px;background:transparent;color:var(--ink-soft);border:none;
  box-shadow:none;font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--card);color:var(--accent);font-weight:700;box-shadow:var(--shadow-raised-sm)}
.sw{margin-left:auto;font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:7px;font-weight:600}
.sw b{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:3px 13px;font-weight:700;color:var(--ink-soft);transition:.2s;box-shadow:var(--shadow-raised-sm)}
.sw b:active{box-shadow:var(--shadow-inset)}
.sw b.on{color:var(--accent-2);border-color:var(--accent-2)}
#sleepleft{color:var(--warn);font-size:12px}

/* 搜索 */
#q{width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;
  color:var(--ink);font-size:14px;padding:13px 16px;margin-bottom:14px;outline:none;
  font-family:inherit;font-weight:500;box-shadow:var(--shadow-inset);transition:.25s}
#q:focus{box-shadow:var(--shadow-inset),0 0 0 3px var(--accent-soft)}

h2{font-size:14px;color:var(--ink-soft);margin:16px 0 10px;font-weight:700;
  display:flex;align-items:center;gap:8px;font-family:var(--font-display,inherit)}
#chkall{max-width:none;flex:0 0 auto;padding:5px 13px;font-size:11px;border-radius:12px;
  background:var(--card);color:var(--accent-4);border:1px solid var(--line);
  font-family:inherit;font-weight:700;box-shadow:var(--shadow-raised-sm)}
#chkall:active{box-shadow:var(--shadow-inset)}
#chkall.busy{color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:11px;color:var(--ink-soft);
  margin-bottom:12px;font-weight:600}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{display:block;width:14px;height:5px;border-radius:3px}

/* 分组 */
.grp{background:var(--card);border:1px solid var(--line);
  border-left:4px solid var(--gc,var(--accent));border-radius:var(--r-md,16px);
  padding:14px 14px 6px;margin-bottom:12px;box-shadow:var(--shadow-card)}
.grp h3{font-size:13px;color:var(--gc,var(--accent));font-weight:700;margin-bottom:10px;
  font-family:var(--font-display,inherit)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid button{padding:11px 4px 9px;font-size:12px;border-radius:12px;max-width:none;
  min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:4px;
  background:var(--card);box-shadow:var(--shadow-raised-sm);font-weight:500}
.grid button .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.grid button.on{background:linear-gradient(145deg,var(--accent),var(--accent-deep));
  color:var(--accent-fg,#fff);font-weight:700;box-shadow:var(--shadow-accent)}
.grid button.on:active{box-shadow:var(--shadow-accent-inset)}
.grid button .hlrow{display:flex;align-items:center;justify-content:center;gap:4px}
.grid button .hlrow em{font-size:10px;font-style:normal;color:var(--muted);min-height:12px}
.grid button.on .hlrow em{color:var(--accent-fg-soft,rgba(255,255,255,.8))}
.led{display:block;width:14px;height:5px;border-radius:3px;background:var(--muted);
  flex:0 0 auto;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.led.h-ok{background:var(--ok);box-shadow:0 0 6px var(--ok-glow,rgba(0,0,0,0))}
.led.h-err{background:var(--err);box-shadow:0 0 6px var(--err-glow,rgba(0,0,0,0))}
.led.h-new{background:var(--muted)}
@media(max-width:390px){.grid{grid-template-columns:repeat(3,1fr)}h1{font-size:17px}
  .theme-bar{order:3;width:100%;justify-content:flex-end}}

footer{font-size:11px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.8;font-weight:500}
footer .ft1{font-size:12px;color:var(--ink-soft);font-weight:700}
footer nav{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center}
footer nav b{color:var(--muted);font-weight:400}
footer a,.ghub-foot{color:var(--accent);text-decoration:none;font-weight:600}
footer a:hover{text-decoration:underline}
.ghub-foot{font-size:12px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:3px 10px;white-space:nowrap}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 0}

/* ============================================================
   风格 1：深奶油 / 奶茶（默认）
   ============================================================ */
[data-style="cream"]{
  --bg:#E8DDCB;
  --bg-overlay:radial-gradient(ellipse 70% 50% at 50% 0%,#EFD9BE 0%,transparent 60%);
  --card:#F3EBDD;--line:#D9C9AF;
  --surface:#DBCBB2;
  --ink:#3E342A;--ink-soft:#7A6B5A;--muted:#A89884;
  --accent:#E8734F;--accent-deep:#C85A36;--accent-soft:rgba(232,115,79,.22);
  --accent-fg:#fff;--accent-fg-soft:rgba(255,255,255,.85);
  --accent-2:#5FA885;--accent-3:#D4A23A;--accent-4:#927FB8;
  --ok:#5FA885;--warn:#D4A23A;--err:#B84A32;
  --ok-glow:rgba(95,168,133,.5);--err-glow:rgba(184,74,50,.5);
  --chip-bg:rgba(95,168,133,.15);
  --warn-bg:rgba(212,162,58,.15);--err-bg:rgba(184,74,50,.12);
  --shadow-card:10px 10px 28px rgba(140,110,75,.22),-5px -5px 18px rgba(255,250,240,.45);
  --shadow-raised:7px 7px 16px rgba(140,110,75,.3),-5px -5px 12px rgba(255,250,240,.55);
  --shadow-raised-sm:5px 5px 11px rgba(140,110,75,.26),-3px -3px 8px rgba(255,250,240,.5);
  --shadow-inset:inset 4px 4px 9px rgba(140,110,75,.32),inset -3px -3px 7px rgba(255,250,240,.45);
  --shadow-accent:7px 7px 18px rgba(200,90,54,.38),-3px -3px 10px rgba(255,250,240,.4),inset 0 1px 0 rgba(255,255,255,.3);
  --shadow-accent-inset:inset 4px 4px 9px rgba(160,65,35,.42),inset -2px -2px 6px rgba(255,255,255,.18);
  --r-lg:26px;--r-md:16px;
  --font-display:"Quicksand","Noto Sans SC",sans-serif;
  --font-body:"Quicksand","Noto Sans SC",sans-serif;
}
[data-style="cream"][data-tone="dark"]{
  --bg:#2A2018;
  --bg-overlay:radial-gradient(ellipse 70% 50% at 50% 0%,#4A3322 0%,transparent 60%);
  --card:#3A2E22;--line:#4A3B2A;
  --surface:#2E2418;
  --ink:#F0E6D6;--ink-soft:#C8B89C;--muted:#8A7A64;
  --accent:#FF9B76;--accent-deep:#E07A52;--accent-soft:rgba(255,155,118,.25);
  --accent-2:#7FCBA3;--accent-3:#E8C46A;--accent-4:#B3A1D4;
  --ok:#7FCBA3;--warn:#E8C46A;--err:#E08A72;
  --ok-glow:rgba(127,203,163,.5);--err-glow:rgba(224,138,114,.5);
  --chip-bg:rgba(127,203,163,.15);
  --warn-bg:rgba(232,196,106,.15);--err-bg:rgba(224,138,114,.12);
  --shadow-card:10px 10px 28px rgba(0,0,0,.45),-3px -3px 12px rgba(255,220,180,.06);
  --shadow-raised:6px 6px 14px rgba(0,0,0,.4),-3px -3px 10px rgba(255,220,180,.05);
  --shadow-raised-sm:4px 4px 10px rgba(0,0,0,.35),-2px -2px 7px rgba(255,220,180,.04);
  --shadow-inset:inset 4px 4px 9px rgba(0,0,0,.5),inset -2px -2px 6px rgba(255,220,180,.05);
  --shadow-accent:6px 6px 16px rgba(224,122,82,.4),inset 0 1px 0 rgba(255,255,255,.2);
  --shadow-accent-inset:inset 3px 3px 8px rgba(0,0,0,.4);
}

/* ============================================================
   风格 2：霓虹夜色
   ============================================================ */
[data-style="neon"]{
  --bg:#0d1030;
  --bg-overlay:
    radial-gradient(ellipse 80% 50% at 50% -10%,rgba(157,78,221,.35),transparent 60%),
    radial-gradient(ellipse 60% 40% at 100% 100%,rgba(255,45,149,.18),transparent 60%),
    linear-gradient(rgba(0,240,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,240,255,.05) 1px,transparent 1px);
  --bg-overlay-size:auto,auto,40px 40px,40px 40px;
  --card:rgba(20,22,52,.6);--line:rgba(0,240,255,.25);
  --surface:rgba(0,240,255,.08);
  --ink:#e8f4ff;--ink-soft:#8a9bc8;--muted:#5a6a98;
  --accent:#00f0ff;--accent-deep:#0088cc;--accent-soft:rgba(0,240,255,.18);
  --accent-fg:#0a0a1a;--accent-fg-soft:rgba(10,10,26,.7);
  --accent-2:#ff2d95;--accent-3:#ffd166;--accent-4:#9d4edd;
  --ok:#23f5a2;--warn:#ffd166;--err:#ff4757;
  --ok-glow:rgba(35,245,162,.6);--err-glow:rgba(255,71,87,.6);
  --chip-bg:rgba(0,240,255,.1);
  --warn-bg:rgba(255,209,102,.1);--err-bg:rgba(255,71,87,.1);
  --shadow-card:0 0 30px rgba(0,240,255,.08),inset 0 1px 0 rgba(255,255,255,.05);
  --shadow-raised:0 0 0 1px rgba(0,240,255,.15),0 4px 14px rgba(0,0,0,.4);
  --shadow-raised-sm:0 0 0 1px rgba(0,240,255,.12),0 2px 8px rgba(0,0,0,.3);
  --shadow-inset:inset 0 2px 6px rgba(0,0,0,.5);
  --shadow-accent:0 0 20px rgba(0,240,255,.5),inset 0 1px 0 rgba(255,255,255,.3);
  --shadow-accent-inset:inset 0 2px 6px rgba(0,80,100,.5);
  --r-lg:16px;--r-md:12px;
  --card-blur:blur(8px);
  --font-display:"Orbitron","Noto Sans SC",sans-serif;
  --font-body:"Noto Sans SC",sans-serif;
}
[data-style="neon"][data-tone="dark"]{
  --bg:#050514;
  --bg-overlay:
    radial-gradient(ellipse 80% 50% at 50% -10%,rgba(157,78,221,.5),transparent 60%),
    radial-gradient(ellipse 60% 40% at 100% 100%,rgba(255,45,149,.28),transparent 60%),
    linear-gradient(rgba(0,240,255,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,240,255,.07) 1px,transparent 1px);
  --bg-overlay-size:auto,auto,40px 40px,40px 40px;
  --card:rgba(12,14,40,.75);
}
[data-style="neon"] h1{background:linear-gradient(90deg,var(--accent),var(--accent-2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
[data-style="neon"] .grid button.on{color:var(--accent-fg)}

/* ============================================================
   风格 3：复古木机
   ============================================================ */
[data-style="vintage"]{
  --bg:#3a2412;
  --bg-overlay:
    radial-gradient(ellipse 100% 80% at 50% 0%,#5a3618,#2a180a 70%),
    repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 1px,transparent 1px 6px);
  --card:rgba(48,30,14,.92);--line:#6b4422;
  --surface:#2a180a;
  --ink:#f0e0c0;--ink-soft:#b89870;--muted:#8a7050;
  --accent:#ffb347;--accent-deep:#e8932a;--accent-soft:rgba(255,179,71,.2);
  --accent-fg:#2a1a0a;--accent-fg-soft:rgba(42,26,10,.7);
  --accent-2:#7ec850;--accent-3:#c9a227;--accent-4:#e8932a;
  --ok:#7ec850;--warn:#ffe08a;--err:#e8503a;
  --ok-glow:rgba(126,200,80,.6);--err-glow:rgba(232,80,58,.6);
  --chip-bg:rgba(255,179,71,.12);
  --warn-bg:rgba(255,224,138,.1);--err-bg:rgba(232,80,58,.1);
  --shadow-card:inset 0 2px 0 rgba(255,200,120,.12),inset 0 -4px 12px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.5);
  --shadow-raised:inset 0 1px 0 rgba(255,200,120,.2),0 3px 6px rgba(0,0,0,.4);
  --shadow-raised-sm:inset 0 1px 0 rgba(255,200,120,.15),0 2px 5px rgba(0,0,0,.35);
  --shadow-inset:inset 0 2px 5px rgba(0,0,0,.6);
  --shadow-accent:inset 0 1px 0 rgba(255,255,255,.4),0 0 18px rgba(255,179,71,.5);
  --shadow-accent-inset:inset 0 2px 6px rgba(120,70,10,.6);
  --r-lg:16px;--r-md:10px;
  --font-display:"Playfair Display","Noto Serif SC",serif;
  --font-body:"Noto Serif SC",serif;
}
[data-style="vintage"][data-tone="dark"]{
  --bg:#1a0f06;
  --bg-overlay:
    radial-gradient(ellipse 100% 80% at 50% 0%,#3a2010,#0f0804 70%),
    repeating-linear-gradient(90deg,rgba(0,0,0,.1) 0 1px,transparent 1px 6px);
  --card:rgba(36,22,10,.95);
}
[data-style="vintage"] h1{font-style:italic;color:var(--accent);
  text-shadow:0 2px 4px rgba(0,0,0,.6),0 0 18px rgba(255,179,71,.3)}
[data-style="vintage"] h1::before{content:"♪ ";color:var(--accent-3)}

/* ============================================================
   风格 4：极光玻璃
   ============================================================ */
[data-style="aurora"]{
  --bg:#eef2ff;
  --bg-overlay:
    radial-gradient(circle 200px at 15% 10%,rgba(167,139,250,.5),transparent 70%),
    radial-gradient(circle 180px at 85% 25%,rgba(34,211,238,.4),transparent 70%),
    radial-gradient(circle 170px at 25% 85%,rgba(240,171,252,.4),transparent 70%),
    radial-gradient(circle 160px at 80% 80%,rgba(134,239,172,.4),transparent 70%);
  --card:rgba(255,255,255,.72);--line:rgba(255,255,255,.7);
  --surface:rgba(255,255,255,.5);
  --ink:#1e2a3a;--ink-soft:#4a5a6e;--muted:#8a99ad;
  --accent:#7c5cff;--accent-deep:#9333ea;--accent-soft:rgba(124,92,255,.18);
  --accent-fg:#fff;--accent-fg-soft:rgba(255,255,255,.85);
  --accent-2:#22d3ee;--accent-3:#f59e0b;--accent-4:#a855f7;
  --ok:#10b981;--warn:#f59e0b;--err:#ef4444;
  --ok-glow:rgba(16,185,129,.5);--err-glow:rgba(239,68,68,.5);
  --chip-bg:rgba(124,92,255,.12);
  --warn-bg:rgba(245,158,11,.12);--err-bg:rgba(239,68,68,.1);
  --shadow-card:0 8px 32px rgba(31,38,135,.12),0 2px 8px rgba(31,38,135,.08);
  --shadow-raised:0 2px 12px rgba(31,38,135,.1);
  --shadow-raised-sm:0 2px 10px rgba(31,38,135,.08);
  --shadow-inset:inset 0 2px 5px rgba(31,38,135,.12);

<audio id="au" preload="none" playsinline webkit-playsinline></audio>
<script>
/* ================= 电台配置：加台只改这里 =================
   n=台名  u=流地址  t=类型(hls 走 hls.js / mp3 直连 audio)  g=分组名 */
var STATIONS=[
  {n:'上海动感101', u:'http://lhttp.qingting.fm/live/274/64k.mp3',  t:'mp3',g:'音乐'},
  {n:'经典947',     u:'http://lhttp.qingting.fm/live/267/64k.mp3',  t:'mp3',g:'音乐'},
  {n:'北京音乐广播',u:'http://lhttp.qingting.fm/live/332/64k.mp3',  t:'mp3',g:'音乐'},
  {n:'广东音乐之声',u:'http://lhttp.qingting.fm/live/1260/64k.mp3', t:'mp3',g:'音乐'},
  {n:'深圳音乐广播',u:'http://lhttp.qingting.fm/live/1271/64k.mp3', t:'mp3',g:'音乐'},
  {n:'HIT FM',      u:'http://lhttp.qingting.fm/live/15318703/64k.mp3',t:'mp3',g:'音乐'},
  {n:'清晨音乐台',  u:'http://lhttp.qingting.fm/live/4915/64k.mp3', t:'mp3',g:'音乐'},
  {n:'AsiaFM亚洲',  u:'http://lhttp.qingting.fm/live/4581/64k.mp3', t:'mp3',g:'音乐'},
  {n:'北京新闻广播',u:'http://lhttp.qingting.fm/live/339/64k.mp3',  t:'mp3',g:'新闻财经'},
  {n:'深圳新闻广播',u:'http://lhttp.qingting.fm/live/1270/64k.mp3', t:'mp3',g:'新闻财经'},
  {n:'第一财经',    u:'http://lhttp.qingting.fm/live/276/64k.mp3',  t:'mp3',g:'新闻财经'},
  {n:'江苏新闻广播',u:'http://lhttp.qingting.fm/live/4944/64k.mp3', t:'mp3',g:'新闻财经'},
  {n:'浙江之声',    u:'http://lhttp.qingting.fm/live/4518/64k.mp3', t:'mp3',g:'新闻财经'},
  {n:'苏州儿童广播',u:'http://lhttp.qingting.fm/live/2807/64k.mp3', t:'mp3',g:'少儿故事'},
  {n:'大连少儿广播',u:'http://lhttp.qingting.fm/live/1084/64k.mp3', t:'mp3',g:'少儿故事'},
  {n:'江苏故事广播',u:'http://lhttp.qingting.fm/live/20012/64k.mp3',t:'mp3',g:'少儿故事'},
  {n:'BBC 世界台',  u:'http://stream.live.vc.bbcmedia.co.uk/bbc_world_service',t:'mp3',g:'国际'},
  {n:'新加坡Yes933',u:'http://playerservices.streamtheworld.com/api/livestream-redirect/YES933.mp3',t:'mp3',g:'私人定制'},
  /* 成都地区（2026-09-28 按蜻蜓热度榜选取，音源已实测可播） */
  {n:'四川新闻广播FM106.1', u:'http://lhttp.qingting.fm/live/4906/64k.mp3',   t:'mp3',g:'成都'},
  {n:'四川交通广播FM101.7', u:'http://lhttp.qingting.fm/live/4886/64k.mp3',   t:'mp3',g:'成都'},
  {n:'成都年代音乐怀旧好声音',u:'http://lhttp.qingting.fm/live/20211686/64k.mp3',t:'mp3',g:'成都'},
  {n:'年代音乐1022',       u:'http://lhttp.qingting.fm/live/20500066/64k.mp3',t:'mp3',g:'成都'},
  {n:'成都电台FM94.6',     u:'http://lhttp.qingting.fm/live/4892/64k.mp3',   t:'mp3',g:'成都'}
];
var GROUP_COLORS=['#E8734F','#5FA885','#D4A23A','#927FB8','#22d3ee','#f778ba'];

/* ================= 状态 ================= */
var cur=-1,live=false,hls=null,hlsLoading=false;
var retryN=0,retryTmr=null,MAX_RETRY=3;
var reconnect=localStorage.getItem('wr_reconnect')!=='0';
var sleepTmr=null,sleepEnd=0,sleepMin=0;
var FAV=[],HEALTH={};
try{FAV=JSON.parse(localStorage.getItem('wr_fav')||'[]')}catch(e){}
try{HEALTH=JSON.parse(localStorage.getItem('wr_health')||'{}')}catch(e){}
var audio=document.getElementById('au');

function $(id){return document.getElementById(id)}
function esc(s){return (s||'').replace(/[&<>"]/g,function(c){
  return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function chip(t,c){var e=$('st');e.textContent=t;e.className='chip '+(c||'')}
function saveFav(){localStorage.setItem('wr_fav',JSON.stringify(FAV))}
function saveHealth(){localStorage.setItem('wr_health',JSON.stringify(HEALTH))}
function isFav(n){return FAV.indexOf(n)>=0}

/* ================= 播放核心 ================= */
function withHls(cb){
  if(window.Hls){cb();return}
  if(hlsLoading)return;
  hlsLoading=true;
  var s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js';
  s.onload=function(){hlsLoading=false;cb()};
  s.onerror=function(){hlsLoading=false;chip('HLS 组件加载失败（需联网）','err');
    markHealth('err')};
  document.head.appendChild(s);
}
function attach(i,bust){
  var st=STATIONS[i];
  if(hls){hls.destroy();hls=null}
  var url=st.u+(bust?(st.u.indexOf('?')<0?'?':'&')+'r='+Date.now():'');
  if(st.t==='hls'){
    if(audio.canPlayType('application/vnd.apple.mpegurl')){
      audio.src=url;
    }else{
      withHls(function(){
        if(cur!==i)return;
        hls=new Hls({liveSyncDurationCount:3});
        hls.loadSource(url);
        hls.attachMedia(audio);
        hls.on(Hls.Events.ERROR,function(ev,data){
          if(data&&data.fatal){
            chip('流错误，尝试重连…','warn');markHealth('err');tryReconnect();
          }
        });
      });
    }
  }else{
    audio.src=url;
  }
}
function play(i){
  if(i<0||i>=STATIONS.length)return;
  setNow(i);
  clearRetry();
  live=true;chip('缓冲中…','warn');ppBtn();
  attach(i,false);
  var p=audio.play();
  if(p)p.then(function(){chip('播放中','ok')}).catch(playErr);
  localStorage.setItem('wr_last',i);
}
function playErr(e){
  var n=e&&e.name;
  if(n==='NotAllowedError')chip('点一下播放以出声（浏览器限制）','warn');
  else if(n==='AbortError'){/* 自己触发的切台，正常 */}
  else chip('播放失败','err');
}
function setNow(i){
  cur=i;
  $('now').textContent=i<0?'未播放':STATIONS[i].n;
  var bs=document.querySelectorAll('#list button[data-i]');
  for(var k=0;k<bs.length;k++)
    bs[k].className=(+bs[k].getAttribute('data-i')===i)?'on':'';
  favBtn();msMeta();ppBtn();
}
function ppBtn(){
  $('pp').textContent=(live&&!audio.paused)?'⏸ 暂停':'▶ 播放';
}
function tune(i){if(i<0||i>=STATIONS.length)return;play(i)}
function toggle(){
  if(cur<0){tune(0);return}
  if(!live||audio.paused){play(cur);return}
  audio.pause();chip('已暂停','');ppBtn();
}
function stopAll(){
  live=false;clearRetry();
  audio.pause();audio.removeAttribute('src');
  if(hls){hls.destroy();hls=null}
  setSleep(0);
  setNow(-1);chip('已停止','');
}
function next(){tune(cur<0?0:(cur+1)%STATIONS.length)}
function prev(){tune(cur<0?0:(cur+STATIONS.length-1)%STATIONS.length)}

/* ================= 断线自动重连 ================= */
function tryReconnect(){
  if(!reconnect||!live||cur<0)return;
  if(retryN>=MAX_RETRY){chip('重连失败，请手动播放','err');return}
  retryN++;
  chip('断线重连中（'+retryN+'/'+MAX_RETRY+'）…','warn');
  retryTmr=setTimeout(function(){
    if(!live||cur<0)return;
    attach(cur,true);
    var p=audio.play();
    if(p)p.catch(playErr);
  },retryN*3000);
}
function clearRetry(){retryN=0;if(retryTmr){clearTimeout(retryTmr);retryTmr=null}}
function rcToggle(){
  reconnect=!reconnect;
  localStorage.setItem('wr_reconnect',reconnect?'1':'0');
  var b=$('rcb');b.textContent=reconnect?'开':'关';
  b.className=reconnect?'on':'';
}
audio.addEventListener('playing',function(){
  if(!live)return;
  clearRetry();chip('播放中','ok');markHealth('ok');
});
audio.addEventListener('error',function(){
  if(!live)return;
  chip('连接断开','err');markHealth('err');tryReconnect();
});
audio.addEventListener('stalled',function(){
  if(live&&!audio.paused){chip('缓冲中…','warn');}
});

/* ================= 客户端健康灯 ================= */
function markHealth(v){
  if(cur<0)return;
  HEALTH[STATIONS[cur].n]=v;saveHealth();render();
}

/* ================= 收藏 ================= */
function favToggle(){
  if(cur<0)return;
  var n=STATIONS[cur].n,i=FAV.indexOf(n);
  if(i<0)FAV.push(n);else FAV.splice(i,1);
  saveFav();favBtn();render();
}
function favBtn(){
  var b=$('favb'),on=cur>=0&&isFav(STATIONS[cur].n);
  b.textContent=on?'★':'☆';b.className='favb'+(on?' on':'');
}

/* ================= 定时关闭 ================= */
var SLEEP_OPTS=[0,15,30,45,60];
function sleepBox(){
  $('sleepseg').innerHTML=SLEEP_OPTS.map(function(m){
    return '<button type="button" data-m="'+m+'" class="'+(m===sleepMin?'on':'')+'">'
      +(m===0?'关':m+"'")+'</button>';
  }).join('');
}
$('sleepseg').onclick=function(ev){
  var b=ev.target.closest?ev.target.closest('button'):null;
  if(b)setSleep(+b.getAttribute('data-m'));
};
function setSleep(m){
  sleepMin=m;
  if(sleepTmr){clearTimeout(sleepTmr);sleepTmr=null}
  if(m>0){
    sleepEnd=Date.now()+m*60000;
    sleepTmr=setTimeout(function(){
      stopAll();chip('定时关闭已到点','warn');sleepBox();
    },m*60000);
  }else sleepEnd=0;
  sleepBox();sleepTick();
}
function sleepTick(){
  var e=$('sleepleft');
  if(!sleepEnd){e.style.display='none';return}
  var s=Math.max(0,Math.round((sleepEnd-Date.now())/1000));
  e.style.display='';
  e.textContent='⏱ '+Math.floor(s/60)+':'+('0'+s%60).slice(-2)+' 后停止';
}

/* ================= 音量 ================= */
function volIn(x){
  audio.volume=x/100;$('vv').textContent=x;
  localStorage.setItem('wr_vol',x);
}

/* ================= 渲染电台列表 ================= */
function render(){
  var q=($('q').value||'').trim(),box=$('list');
  box.innerHTML='';
  var groups=[],gmap={},gi=0;
  var favs=STATIONS.filter(function(s){return isFav(s.n)});
  var filtered=STATIONS.filter(function(s){
    return !q||s.n.toLowerCase().indexOf(q.toLowerCase())>=0});
  if(!q&&favs.length){
    groups.push({name:'⭐ 我的收藏',items:favs});
  }
  filtered.forEach(function(s){
    if(!gmap[s.g]){gmap[s.g]={name:s.g,items:[]};groups.push(gmap[s.g])}
    gmap[s.g].items.push(s);
  });
  var shown=0;
  groups.forEach(function(g){
    var items=g.items.filter(function(s){
      return !q||s.n.toLowerCase().indexOf(q.toLowerCase())>=0});
    if(!items.length)return;
    shown+=items.length;
    var c=GROUP_COLORS[gi++%GROUP_COLORS.length];
    var w=document.createElement('div');w.className='grp';
    w.style.setProperty('--gc',c);
    var t=document.createElement('h3');t.textContent=g.name;t.style.color=c;
    w.appendChild(t);
    var grid=document.createElement('div');grid.className='grid';
    items.forEach(function(s){
      var idx=STATIONS.indexOf(s);
      var b=document.createElement('button');
      b.setAttribute('data-i',idx);
      var h=HEALTH[s.n];
      var led=h==='ok'?'h-ok':(h==='err'?'h-err':'h-new');
      var star=isFav(s.n)?'★':'';
      b.innerHTML='<span class="nm">'+esc(s.n)+'</span>'
        +'<span class="hlrow"><i class="led '+led+'"></i><em>'+star+'</em></span>';
      b.title=s.n+'（'+(s.t==='hls'?'HLS':'MP3')+'）';
      b.onclick=function(){tune(idx)};
      if(idx===cur)b.className='on';
      grid.appendChild(b);
    });
    w.appendChild(grid);box.appendChild(w);
  });
  if(!shown)box.innerHTML='<div class="empty">没有匹配的电台</div>';
  $('cnt').textContent=STATIONS.length+' 台';
}

/* ================= MediaSession 锁屏控制 ================= */
function msMeta(){
  if(!navigator.mediaSession)return;
  try{
    navigator.mediaSession.metadata=cur<0?null:new MediaMetadata(
      {title:STATIONS[cur].n,artist:'音波陪伴（网络收音机） v1.5'});
  }catch(e){}
}
if(navigator.mediaSession){
  [['play',function(){if(cur<0)tune(0);else{audio.play().catch(playErr);ppBtn()}}],
   ['pause',function(){audio.pause();chip('已暂停','');ppBtn()}],
   ['previoustrack',prev],['nexttrack',next]
  ].forEach(function(x){
    try{navigator.mediaSession.setActionHandler(x[0],x[1])}catch(e){}
  });
  var msState=function(){
    try{navigator.mediaSession.playbackState=audio.paused?'paused':'playing'}catch(e){}};
  audio.addEventListener('play',msState);
  audio.addEventListener('pause',msState);
}

/* ================= 键盘快捷键 ================= */
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();toggle()}
  else if(e.code==='ArrowRight')next();
  else if(e.code==='ArrowLeft')prev();
});

/* ================= 可播放性检查 ================= */
var CHECKING=false;
function probeHls(url,cb){
  var done=false,fin=function(ok){if(!done){done=true;cb(ok)}};
  setTimeout(function(){fin(false)},8000);
  fetch(url,{cache:'no-store'}).then(function(r){
    if(!r.ok)throw 0;return r.text()}).then(function(t){
    fin(t.indexOf('#EXTM3U')>=0)}).catch(function(){fin(false)});
}
function probeMp3(url,cb){
  var done=false,a=new Audio();
  var fin=function(ok){if(!done){done=true;try{a.removeAttribute('src');a.load()}catch(e){}cb(ok)}};
  a.muted=true;a.preload='auto';
  setTimeout(function(){fin(false)},8000);
  a.oncanplay=function(){fin(true)};
  a.onerror=function(){fin(false)};
  a.src=url;
}
function probeOne(i,cb){
  var st=STATIONS[i];
  if(st.t==='hls')probeHls(st.u,cb);else probeMp3(st.u,cb);
}
function checkAll(){
  if(CHECKING)return;
  CHECKING=true;
  var b=$('chkall'),i=0;
  b.className='busy';
  (function step(){
    if(i>=STATIONS.length){
      CHECKING=false;b.className='';b.textContent='▶ 检查可播';
      render();return}
    var idx=i++;
    b.textContent='检查中 '+i+'/'+STATIONS.length+'…';
    probeOne(idx,function(ok){
      HEALTH[STATIONS[idx].n]=ok?'ok':'err';saveHealth();render();step();
    });
  })();
}

/* ================= 本机缓冲显示 ================= */
setInterval(function(){
  var n=0;
  try{var bd=audio.buffered;
    n=bd.length?Math.round((bd.end(bd.length-1)-audio.currentTime)*10)/10:0}catch(e){}
  $('buf').textContent='本机缓冲 '+(live?n+'s':'—');
  ppBtn();sleepTick();
},2000);

/* ================= 主题切换 ================= */
var STYLES=[
  {key:'cream',name:'奶茶'},
  {key:'neon',name:'霓虹'},
  {key:'vintage',name:'复古'},
  {key:'aurora',name:'极光'}
];
var curStyle=(localStorage.getItem('rb_style')||'cream');
var curTone=(localStorage.getItem('rb_tone')||'system');
function applyStyle(key){
  curStyle=key;
  document.documentElement.setAttribute('data-style',key);
  localStorage.setItem('rb_style',key);
  var s=STYLES.find(function(x){return x.key===key});
  if(s)$('styleName').textContent=s.name;
}
function applyTone(t){
  curTone=t;
  localStorage.setItem('rb_tone',t);
  var dark=t==='dark'||(t==='system'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-tone',dark?'dark':'light');
  var btns=$('toneSeg').querySelectorAll('button');
  for(var i=0;i<btns.length;i++){
    btns[i].className=btns[i].getAttribute('data-tone')===t?'on':'';
  }
}
$('styleBtn').onclick=function(){
  var i=STYLES.findIndex(function(x){return x.key===curStyle});
  applyStyle(STYLES[(i+1)%STYLES.length].key);
};
$('toneSeg').onclick=function(ev){
  var b=ev.target.closest?ev.target.closest('button'):null;
  if(b)applyTone(b.getAttribute('data-tone'));
};
// 跟随系统时监听系统主题变化
if(window.matchMedia){
  var mq=matchMedia('(prefers-color-scheme: dark)');
  var onChange=function(){if(curTone==='system')applyTone('system')};
  if(mq.addEventListener)mq.addEventListener('change',onChange);
  else if(mq.addListener)mq.addListener(onChange);
}
applyStyle(curStyle);applyTone(curTone);

/* ================= 初始化 ================= */
var sv=localStorage.getItem('wr_vol');
if(sv!=null){$('vol').value=sv;volIn(sv)}else audio.volume=0.8;
if(!reconnect)$('rcb').textContent='关';else $('rcb').className='on';
sleepBox();render();
chip('就绪','ok');
checkAll();
</script>
</body>
</html>
